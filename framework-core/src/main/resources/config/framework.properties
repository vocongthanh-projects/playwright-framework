# Timeouts (milliseconds)
timeout.default=10000
timeout.navigation=30000
locator.resolve.timeout=2000

# Browser launch and execution targets
browser.type=chromium
browser.device=
browser.targets=
browser.headless=true
browser.slow-motion=0
browser.executable-path=

# Browser context
context.viewport.width=1440
context.viewport.height=900
context.locale=
context.timezone=
context.permissions=
context.ignore-https-errors=false
context.geolocation.enabled=false
context.geolocation.latitude=0
context.geolocation.longitude=0

# Reusable authentication state
storage-state.enabled=false
storage-state.path=target/state/storage.json
storage-state.ttl-minutes=60
storage-state.persist=false

# Diagnostic artifacts
evidence.directory=target/evidence
evidence.screenshot.full-page=true
evidence.mask-selector=input[type='password'],[data-sensitive='true']
evidence.attach.screenshot=true
evidence.attach.html=true
evidence.attach.trace=false
trace.enabled=true
trace.screenshots=true
trace.snapshots=true
trace.sources=true
video.enabled=false
video.directory=target/evidence/video
video.width=1280
video.height=720

# Generic lifecycle; consumers opt in and provide their own URL
navigation.enabled=false
navigation.base-url=
