workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'

stages:
  - verify

consumer-typescript:
  stage: verify
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  variables:
    CI: "true"
  before_script:
    - export GITLAB_TOKEN="${GITLAB_TOKEN:-$CI_JOB_TOKEN}"
    - test -f package-lock.json || (echo "Create and commit package-lock.json after configuring .npmrc" && exit 1)
  script:
    - npm ci
    - npm run typecheck
