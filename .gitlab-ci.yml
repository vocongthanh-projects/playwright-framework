workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'

stages:
  - verify
  - notify

java-framework:
  stage: verify
  image: mcr.microsoft.com/playwright/java:v1.63.0-noble
  interruptible: true
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
    PLAYWRIGHT_BROWSERS_PATH: "/ms-playwright"
    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  cache:
    key:
      files:
        - playwright-framework-java/pom.xml
        - playwright-framework-java/.mvn/wrapper/maven-wrapper.properties
    paths:
      - .m2/repository/
  before_script:
    - chmod +x playwright-framework-java/mvnw
  script:
    - cd playwright-framework-java
    - ./mvnw --batch-mode --no-transfer-progress -DskipTests -Pbrowser-contract clean verify
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - "playwright-framework-java/**/target/*.jar"

typescript-framework:
  stage: verify
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  interruptible: true
  variables:
    CI: "true"
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      files:
        - playwright-framework-typescript/package-lock.json
    paths:
      - .npm/
  script:
    - cd playwright-framework-typescript
    - npm ci
    - npm run typecheck
    - npm run lint
    - npm run build

telegram-success:
  stage: notify
  image: python:3.12-slim
  when: on_success
  variables:
    TELEGRAM_CHAT_ID: "$TELEGRAM_CHAT_GITLAB_OTS_FLI"
    TELEGRAM_THREAD_ID: "$TELEGRAM_THREAD_GITLAB_OTS_FLI"
    TELEGRAM_STATUS: "success"
  script:
    - python3 scripts/notify_telegram.py
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $TELEGRAM_BOT_TOKEN && $TELEGRAM_CHAT_GITLAB_OTS_FLI && $TELEGRAM_THREAD_GITLAB_OTS_FLI'
      when: on_success
    - when: never
  allow_failure: true

telegram-failure:
  stage: notify
  image: python:3.12-slim
  when: on_failure
  variables:
    TELEGRAM_CHAT_ID: "$TELEGRAM_CHAT_GITLAB_OTS_FLI"
    TELEGRAM_THREAD_ID: "$TELEGRAM_THREAD_GITLAB_OTS_FLI"
    TELEGRAM_STATUS: "failed"
  script:
    - python3 scripts/notify_telegram.py
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $TELEGRAM_BOT_TOKEN && $TELEGRAM_CHAT_GITLAB_OTS_FLI && $TELEGRAM_THREAD_GITLAB_OTS_FLI'
      when: on_failure
    - when: never
  allow_failure: true
