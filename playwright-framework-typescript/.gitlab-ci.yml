stages:
  - compile
  - mirror
  - deploy

variables:
  CI: "true"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules

compile:
  stage: compile
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  script:
    - npm ci
    - npm run typecheck
    - npm run lint
    - npm run build

# Sync this standalone GitLab project into its directory in the personal GitHub monorepo.
mirror_personal_github:
  stage: mirror
  image: alpine:3.22
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  resource_group: personal-github-typescript
  script:
    - apk add --no-cache ca-certificates git
    - test -n "${GITHUB_PUSH_TOKEN:-}" || (echo "GITHUB_PUSH_TOKEN is required" && exit 1)
    - |
      askpass_file="$(mktemp)"
      mirror_dir="$(mktemp -d)"
      trap 'rm -f "$askpass_file"; rm -rf "$mirror_dir"' EXIT
      cat > "$askpass_file" <<'ASKPASS'
      #!/bin/sh
      case "$1" in
        *Username*) printf '%s\n' 'x-access-token' ;;
        *Password*) printf '%s\n' "$GITHUB_PUSH_TOKEN" ;;
        *) exit 1 ;;
      esac
      ASKPASS
      chmod 700 "$askpass_file"
      export GIT_ASKPASS="$askpass_file"
      export GIT_TERMINAL_PROMPT=0

      git clone --branch main --single-branch \
        https://github.com/vocongthanh247/playwright-framework.git "$mirror_dir/repo"
      target_dir="$mirror_dir/repo/playwright-framework-typescript"
      rm -rf "$target_dir"
      mkdir -p "$target_dir"
      git archive HEAD | tar -xf - -C "$target_dir"

      cd "$mirror_dir/repo"
      git config user.name "GitLab CI"
      git config user.email "gitlab-ci@users.noreply.github.com"
      git add -- playwright-framework-typescript
      if git diff --cached --quiet; then
        echo "GitHub already contains this TypeScript framework source"
        exit 0
      fi
      git commit -m "chore: sync TypeScript framework from GitLab ${CI_COMMIT_SHORT_SHA}"
      git push origin HEAD:refs/heads/main

# npm registry versions are immutable, unlike Maven SNAPSHOTs — so `develop` pushes publish a
# `-dev.<sha>` prerelease under the `next` dist-tag (opt-in), while a `vX.Y.Z` tag publishes the
# real release under the default `latest` dist-tag. Consumers pin an exact tagged version.
deploy:
  stage: deploy
  image: node:22
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'
  script:
    - npm ci
    - npm config set "//$CI_SERVER_HOST/api/v4/projects/$CI_PROJECT_ID/packages/npm/:_authToken" "$CI_JOB_TOKEN"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        RELEASE_VERSION="${CI_COMMIT_TAG#v}"
        npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
        npm publish --registry="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/npm/"
      else
        DEV_VERSION="$(node -p "require('./package.json').version")-dev.${CI_COMMIT_SHORT_SHA}"
        npm version "$DEV_VERSION" --no-git-tag-version --allow-same-version
        npm publish --tag next --registry="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/npm/"
      fi
